spring.application.name=suture-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SUTURE_DB_URL:jdbc:postgresql://localhost:5432/suture_crm}
spring.datasource.username=${SUTURE_DB_USERNAME:suture}
spring.datasource.password=${SUTURE_DB_PASSWORD:suture_dev_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

spring.mvc.problemdetails.enabled=true
