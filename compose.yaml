services:
  postgres:
    image: postgres:17-alpine
    container_name: suture-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suture_crm}
      POSTGRES_USER: ${POSTGRES_USER:-suture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suture_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - suture_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  suture_postgres_data:
